
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Tasyakuran Khitan Arkha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MUSIK -->
    <audio id="backgroundMusic" loop preload="none">
        <source src="assets/lagu.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle" class="music-btn">
        ♪ ON
    </button>

    <!-- HALAMAN 1 -->
    <section id="page1" class="page active">
        <video autoplay muted playsinline loop preload="none" poster="assets/halaman-satu.jpg">
            <source src="assets/halaman-satu.mp4" type="video/mp4">
        </video>

        <div class="overlay">
            <button onclick="goToPage(2)" class="open-btn">
                Buka Undangan
            </button>
        </div>
    </section>

    <!-- HALAMAN 2 -->
    <section id="page2" class="page">
        <video muted playsinline loop preload="none" data-poster="assets/halaman-dua.jpg">
            <source data-src="assets/halaman-dua.mp4" type="video/mp4">
        </video>

        <div class="overlay">
            <p class="guest-label">
                Kepada Bapak/Ibu/Saudara(i):
            </p>

            <h2 id="guestName">Tamu Undangan</h2>

            <button onclick="goToPage(3)" class="open-btn">
                Lihat Undangan
            </button>
        </div>
    </section>

    <!-- HALAMAN 3: CANVA -->
    <section id="page3" class="page canva-page">

        <iframe
            data-src="https://www.canva.com/design/DAHaTyjxdXQ/vnb-S7qy1MNy2RqA_SiIuw/view?embed"
            allowfullscreen
            loading="lazy">
        </iframe>

    </section>

    <script src="script.js"></script>
</body>
</html>
